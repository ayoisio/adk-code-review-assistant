  List: typing.List
  logging: logging
  LoopAgent: google.adk.agents.LoopAgent
  model_validator: pydantic.model_validator
  Optional: typing.Optional
  os: os
  pycodestyle: pycodestyle
  ReadonlyContext: google.adk.agents.readonly_context.ReadonlyContext
  root_agent: code_review_assistant.agent.root_agent
  save_fix_report: code_review_assistant.tools.save_fix_report
  save_grading_report: code_review_assistant.tools.save_grading_report
  search_past_feedback: code_review_assistant.tools.search_past_feedback
  SequentialAgent: google.adk.agents.SequentialAgent
  SettingsConfigDict: pydantic_settings.SettingsConfigDict
  StateKeys: constants.StateKeys
  style_checker_agent: style_checker.style_checker_agent
  sys: sys
  tempfile: tempfile
  test_runner_agent: test_runner.test_runner_agent
  ThreadPoolExecutor: concurrent.futures.ThreadPoolExecutor
  ToolContext: google.adk.tools.ToolContext
  types: google.genai.types
  update_grading_progress: code_review_assistant.tools.update_grading_progress
  validate_fixed_style: code_review_assistant.tools.validate_fixed_style

